[server]
maxUploadSize = 200

# En Streamlit Cloud el watcher de archivos agota el limite de inotify del
# contenedor y llena los logs con:
#     OSError: [Errno 28] inotify watch limit reached
# En produccion no hace falta vigilar cambios: el codigo solo cambia al
# redesplegar, y el redespliegue ya reinicia el proceso.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#1F4E78"
base = "light"
