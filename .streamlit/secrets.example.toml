# ---------------------------------------------------------------------------
# NOTIFICACIONES POR CORREO
# ---------------------------------------------------------------------------
# Motor: engines/notify.py. Es el UNICO punto por donde sale un correo.
#
# Si esta seccion no existe, la app funciona igual y NO envia nada: el
# transporte cae a "consola" y cada intento queda registrado en Auditoria con
# el motivo. Nunca hay que tocar codigo para apagar los avisos.
#
# [notificaciones]
# activo             = true
# transporte         = "smtp"        # "smtp" | "graph" | "consola"
# remitente          = "catalogo@forus.pe"
# remitente_nombre   = "Catalog Control Center"
# url_app            = "https://catalogo-control-center.streamlit.app"
# ventana_duplicado  = 300           # segundos; evita reenvios por doble clic
#
# Area de Producto: quienes reciben "la carga SIAL termino, toca cargar
# precios". Sin esto, el boton "Solicitar carga de precios" queda desactivado.
# area_producto      = ["producto@forus.pe"]
#
# Copia oculta permanente (opcional), para tener trazabilidad en una casilla.
# copia_siempre      = ["catalogo.avisos@forus.pe"]

# --- Opcion A: casilla corporativa por SMTP --------------------------------
# Funciona con Google Workspace y con Microsoft 365 SI el area de sistemas
# habilita SMTP AUTH en la casilla de envio. Microsoft desactiva por defecto
# la autenticacion basica de SMTP desde 2023: si al probar sale
# "SmtpClientAuthentication is disabled", usa la opcion B.
#
# [notificaciones.smtp]
# host        = "smtp.office365.com"   # Google Workspace: "smtp.gmail.com"
# puerto      = 587
# usuario     = "catalogo@forus.pe"
# clave       = "CONTRASENA_DE_APLICACION"
# starttls    = true
# ssl_directo = false                  # true solo si el puerto es 465

# --- Opcion B: Microsoft 365 por Graph (recomendada en M365) ---------------
# No depende de SMTP AUTH. Requiere un registro de aplicacion en Entra ID con
# el permiso de APLICACION Mail.Send, consentido por un administrador. Conviene
# acotarlo con una politica de acceso a aplicaciones para que solo pueda
# enviar desde la casilla de catalogo y no desde cualquier buzon.
#
# [notificaciones.graph]
# tenant_id      = "00000000-0000-0000-0000-000000000000"
# client_id      = "00000000-0000-0000-0000-000000000000"
# client_secret  = "SECRETO_DEL_REGISTRO_DE_APLICACION"
# usuario_envio  = "catalogo@forus.pe"
