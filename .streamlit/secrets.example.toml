# ---------------------------------------------------------------------------
# SOLICITUDES / TICKETS
# ---------------------------------------------------------------------------
# IMPORTANTE: sin esta seccion el backend por defecto es "local", que guarda
# los tickets y sus archivos adjuntos en outputs/catalog_tickets.
# En Streamlit Cloud ese directorio es EFIMERO: se borra en cada redespliegue,
# reinicio o suspension por inactividad. Los tickets y los Excel adjuntos
# se pierden.
#
# Para persistencia real usa el backend "github", que ya esta implementado
# en ticket_system.py (GitHubTicketStore) y guarda tickets y adjuntos en una
# rama dedicada del repositorio, con control de concurrencia por SHA.

[ticketing]
backend = "github"                      # "github" (persistente) o "local" (efimero)
repository = "ORGANIZACION/REPOSITORIO"  # alternativa: owner = "..." y repo = "..."
token = "GITHUB_TOKEN_CON_PERMISO_CONTENTS_READ_WRITE"
branch = "catalog-tickets"              # rama donde se guardan los tickets
prefix = "catalog_tickets"              # carpeta raiz dentro de esa rama

# Horas de SLA por prioridad (opcional)
# [ticketing.sla_hours]
# urgent = 4
# high = 8
# normal = 24
# low = 72

# ---------------------------------------------------------------------------
